
path:  /home/derron/datasets # dataset root dir
train: widerface/train # train images (relative to 'path') 210 images
val: widerface/val # val images (relative to 'path') 53 images

# Keypoints
kpt_shape: [5, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
flip_idx: [1, 0, 2, 4, 3]

# Classes
names:
  0: face

# Keypoint names per class
kpt_names:
  0:
    - left_eye
    - right_eye
    - nose
    - left_mouth
    - right_mouth

